# The merge gate — the reusable check suite.
#
# `pr.yml` and `push.yml` call it on pull requests and master pushes; the nightly
# caller checks parity against blizzard's master.
#
# `tests/test_wire_parity.py` and `tests/test_real_runner_against_mock_hub.py` read a
# sibling `blizzard` checkout and are marked `needs_blizzard`. The ordinary test
# job deselects that marker; the parity job supplies the checkout and runs both.
name: gate

on:
  workflow_call:
    inputs:
      blizzard-ref:
        description: Explicit blizzard branch or tag for the scheduled parity check.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  quality:
    name: ruff + pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # Pinned to match mise.toml's [tools] uv version: `mise run lint`/`typecheck`
          # below resolve uv through mise's own shim, not this step's — an unpinned
          # "latest" here would drift from mise's pin inside the same job.
          version: "0.11.21"
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - name: install mise (runs the mise.toml task definitions, not their tools)
        uses: jdx/mise-action@v2
        with:
          # Pinned: mise's VERSION endpoint can advertise a release before that
          # release's assets exist, and the unpinned action then 404s fetching one.
          version: 2026.9.2
          install: false
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: ruff check (mise run lint)
        run: mise run lint
      - name: pyright (mise run typecheck)
        run: mise run typecheck

  test:
    name: pytest (sans needs_blizzard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # Pinned to match mise.toml's [tools] uv version — see the quality job's comment.
          version: "0.11.21"
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - name: install mise (runs the mise.toml task definitions, not their tools)
        uses: jdx/mise-action@v2
        with:
          version: 2026.9.2
          install: false
      - name: pytest -m "not needs_blizzard" (mise run test)
        run: mise run test -- -m "not needs_blizzard"

  parity:
    name: wire parity (needs_blizzard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: blizzard-mock
          persist-credentials: false
      - name: resolve and check out matching blizzard
        id: blizzard
        uses: ./blizzard-mock/.github/actions/resolve-blizzard-ref
        with:
          explicit-ref: ${{ inputs.blizzard-ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: sync blizzard
        run: uv sync
        working-directory: blizzard
      - name: sync blizzard-mock
        run: uv sync
        working-directory: blizzard-mock
      - name: install mise
        uses: jdx/mise-action@v2
        with:
          version: 2026.9.2
          install: false
      - name: pytest -m needs_blizzard
        run: mise run test -- -m needs_blizzard
        working-directory: blizzard-mock
        env:
          BLIZZARD_SOURCE: ${{ github.workspace }}/blizzard
          BLIZZARD_RUNNER_BIN: ${{ github.workspace }}/blizzard/.venv/bin/blizzard-runner

  process-ref-lint:
    name: process-reference lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install mise + vale
        uses: jdx/mise-action@v2
        with:
          version: 2026.9.2
      - name: process-reference prose lint (mise run process-ref-lint)
        run: mise run process-ref-lint
